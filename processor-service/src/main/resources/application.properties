spring.application.name=processor-service
spring.datasource.url=jdbc:postgresql://localhost:5432/predictions_processor
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.main.allow-bean-definition-overriding=true

sensor.processor.id=SENSOR_PROCESSOR_1

# Defina as configurações do RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Defina os tópicos de envio para o RabbitMQ
rabbitmq.queue.processed-data=processed-data-queue
rabbitmq.queue.metrics=metrics-queue

server.port=10000