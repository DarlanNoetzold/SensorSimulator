version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: config_service_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: config_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: rabbitmq
    ports:
      - "5672:5672"   # Porta para o RabbitMQ
      - "15672:15672" # Porta para a interface de administração do RabbitMQ
    restart: always

volumes:
  postgres_data:
